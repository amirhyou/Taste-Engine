services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"          # external 6380 → internal 6379
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  social-server:
    build:
      context: ../..                              # monorepo root
      dockerfile: examples/social-server/Dockerfile
    ports:
      - "4823:4823"
    environment:
      PORT: "4823"
      REDIS_URL: "redis://redis:6379"             # internal docker network
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:-dev-secret-change-in-production}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
